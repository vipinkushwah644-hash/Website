    // ========================================================

    // ========================================================
    async function handleCustomerAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmailInput')?.value.trim();
      const password = document.getElementById('authPasswordInput')?.value;
      const submitBtn = document.getElementById('authSubmitBtn');

      if (!supabaseClient) {
        alert("Supabase client is not initialized.");
        return;
      }

      submitBtn.disabled = true;
      const originalText = document.getElementById('authSubmitBtnText').innerText;
      document.getElementById('authSubmitBtnText').innerText = "Processing...";

      try {
        const currentUrl = window.location.origin + window.location.pathname;

        // 1. SIGN UP WITH PASSWORD + GMAIL VERIFICATION
        if (currentAuthMode === 'signup') {
          const name = document.getElementById('signupFullNameInput')?.value.trim();
          const phone = document.getElementById('signupPhoneInput')?.value.trim();

          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              emailRedirectTo: currentUrl,
              data: {
                full_name: name,
                phone: phone
              }
            }
          });

          if (error) throw error;

          // If email confirmation is required by Supabase
          if (data?.user && (!data.session || data.user.identities?.length === 0)) {
            showSentScreen(email, "Check Your Email!", "We sent an activation link to verify your account. Please click the link to confirm your Gmail.");
          } else {
            authenticatedUser = {
              email: data.user.email,
              verified: true,
              session: data.session,
              fullName: name,
              phone: phone
            };
            onAuthSuccess(email);
          }

        // 2. INSTANT LOGIN WITH GMAIL + PASSWORD (NO EMAIL NEEDED)
        } else if (currentAuthMode === 'login') {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) throw error;

          authenticatedUser = {
            email: data.user.email,
            verified: true,
            session: data.session,
            fullName: data.user.user_metadata?.full_name || '',
            phone: data.user.user_metadata?.phone || ''
          };
          onAuthSuccess(email);

        // 3. FORGOT PASSWORD FLOW
        } else if (currentAuthMode === 'forgot') {
          const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: currentUrl
          });

          if (error) throw error;
          showSentScreen(email, "Reset Link Sent!", "Check your Gmail for the password recovery link. Click it to choose a new password.");
        }

      } catch (err) {
        alert(`⚠️ Authentication Notice: ${err.message || 'Error occurred during authentication.'}`);
      } finally {
        submitBtn.disabled = false;
        document.getElementById('authSubmitBtnText').innerText = originalText;
      }
    }

      updateAuthHeaderUI();

    async function checkIncomingEmailConfirmation() {
      if (!supabaseClient) return;

      // 1. Check existing session
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        authenticatedUser = { 
          email: session.user.email, 
          verified: true, 
          session: session,
          fullName: session.user.user_metadata?.full_name || '',
          phone: session.user.user_metadata?.phone || ''
        };
        updateAuthHeaderUI();
        return;
      }

      // 2. Auth state listener for email link clicks (signup confirmation or password reset)
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN' && session && session.user) {
          authenticatedUser = { 
            email: session.user.email, 
            verified: true, 
            session: session,
            fullName: session.user.user_metadata?.full_name || '',
            phone: session.user.user_metadata?.phone || ''
          };
          updateAuthHeaderUI();
          closeAuthModal();
          if (window.location.hash) {
            window.history.replaceState(null, null, window.location.pathname + window.location.search);
          }
          alert(`🎉 Email verified successfully! Welcome, ${session.user.user_metadata?.full_name || session.user.email}`);
          if (pendingAction === 'submitCustomOrder') triggerCheckoutModal('custom');
          else if (pendingAction === 'cartCheckout') triggerCheckoutModal('cart');
        } else if (event === 'PASSWORD_RECOVERY') {
          // User clicked reset password link
          const newPass = prompt("🔑 Enter your new password (at least 6 characters):");
          if (newPass && newPass.length >= 6) {
            const { error } = await supabaseClient.auth.updateUser({ password: newPass });
            if (!error) {
              alert("✅ Password updated successfully! You can now log in with your new password.");
            } else {
              alert(`❌ Error updating password: ${error.message}`);
            }
          }
        }
      });
    }

    function triggerCheckoutModal(type) {

        currentCheckoutContext = {
          type: 'custom',
          title: `Custom Frame (${customState.size}" ${customState.mouldingName})`,

          photo: customState.image,
          specs: `${customState.size}" • ${customState.mouldingName} • ${customState.matWidth}" Mat • ${customState.glass === 'museum' ? 'Museum Glass' : 'Clear Acrylic'}`
        };
      } else {
        const total = cart.reduce((acc, item) => acc + item.price, 0);
        currentCheckoutContext = {
          type: 'cart',
          title: `${cart.length} Ready-Made Frame(s)`,
          price: total,
          photo: cart[0]?.image || '',
          specs: cart.map(i => `${i.title} (${i.size})`).join(', ')
        };
      }

      document.getElementById('checkoutItemDescription').innerText = currentCheckoutContext.title;
      document.getElementById('checkoutUserEmail').innerText = authenticatedUser?.email || "verified@customer.com";
      document.getElementById('checkoutTotalAmount').innerText = `₹${currentCheckoutContext.price.toLocaleString('en-IN')}`;
      document.getElementById('submitOrderBtnText').innerText = `Confirm & Pay Online (₹${currentCheckoutContext.price.toLocaleString('en-IN')})`;

      if (authenticatedUser?.fullName) {
        document.getElementById('custFullName').value = authenticatedUser.fullName;
      }
      if (authenticatedUser?.phone) {
        document.getElementById('custPhone').value = authenticatedUser.phone;
      }
      
      toggleFulfillmentMode('delivery');
      syncOwnerPaymentUI();

      const checkoutModal = document.getElementById('checkoutModal');
      if (checkoutModal) checkoutModal.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function closeCheckoutModal() {
      const modal = document.getElementById('checkoutModal');
      if (modal) modal.classList.add('hidden');
      currentCheckoutContext = null;
    }

    function toggleFulfillmentMode(mode) {
      const addressSec = document.getElementById('deliveryAddressSection');
      const addressInput = document.getElementById('deliveryAddressInput');
      const payAtShopOpt = document.getElementById('payAtShopOption');
      const delLabel = document.getElementById('labelPrepaidDelivery');
      const picLabel = document.getElementById('labelStorePickup');
      const submitBtnText = document.getElementById('submitOrderBtnText');

      if (mode === 'delivery') {
        if (addressSec) addressSec.classList.remove('hidden');
        if (addressInput) addressInput.required = true;
        if (payAtShopOpt) payAtShopOpt.classList.add('hidden');
        if (delLabel) delLabel.className = "border-2 border-brand-gold p-3 rounded-xl cursor-pointer bg-brand-cream/40 flex flex-col justify-between";
        if (picLabel) picLabel.className = "border border-stone-200 p-3 rounded-xl cursor-pointer hover:bg-stone-50 flex flex-col justify-between";
        const prepaidRadio = document.querySelector('input[name="paymentMethod"][value="online_prepaid"]');
        if (prepaidRadio) prepaidRadio.checked = true;
        if (submitBtnText) submitBtnText.innerText = `Confirm & Pay Online (₹${currentCheckoutContext ? currentCheckoutContext.price.toLocaleString('en-IN') : ''})`;
      } else {
        if (addressSec) addressSec.classList.add('hidden');
        if (addressInput) addressInput.required = false;
        if (payAtShopOpt) payAtShopOpt.classList.remove('hidden');
        if (picLabel) picLabel.className = "border-2 border-brand-gold p-3 rounded-xl cursor-pointer bg-brand-cream/40 flex flex-col justify-between";
        if (delLabel) delLabel.className = "border border-stone-200 p-3 rounded-xl cursor-pointer hover:bg-stone-50 flex flex-col justify-between";
        if (submitBtnText) submitBtnText.innerText = `Confirm In-Store Pickup Order (₹${currentCheckoutContext ? currentCheckoutContext.price.toLocaleString('en-IN') : ''})`;
      }
    }

    function handleFinalOrderSubmission(e) {
      e.preventDefault();
      const name = document.getElementById('custFullName')?.value || "Customer";
      const phone = document.getElementById('custPhone')?.value || "";
      const fulfillment = document.querySelector('input[name="fulfillmentType"]:checked')?.value || "delivery";
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value || "online_prepaid";
      const address = document.getElementById('deliveryAddressInput')?.value || "";

      let fulfillmentText = fulfillment === 'delivery' ? `Prepaid Doorstep Delivery to: ${address}` : `Store Pickup (Front of Ganesh Mandir, Chola Naka)`;
      let paymentText = paymentMethod === 'online_prepaid' ? `Online Prepayment (Paid via UPI to ${shopPaymentConfig.upiId})` : "Pay at Shop on Collection";

      const orderId = `CM-${Math.floor(1000 + Math.random() * 9000)}`;
      const newOrderRecord = {
        id: orderId,
        date: "Just Now",
        customerName: name,
        customerEmail: authenticatedUser?.email || "guest@gmail.com",
        customerPhone: phone,
        photo: currentCheckoutContext?.photo || "",
        size: currentCheckoutContext?.type === 'custom' ? customState.size : "Ready-Made",
        itemSummary: currentCheckoutContext?.specs || "Picture frame",
        fulfillment: `${fulfillmentText} • [${paymentText}]`,
        price: currentCheckoutContext?.price || 0,
        status: paymentMethod === 'online_prepaid' ? "Prepaid / Order Confirmed" : "Pickup Reserved"
      };

      customOrders.unshift(newOrderRecord);
      if (currentCheckoutContext?.type === 'cart') { cart = []; updateCartUI(); }
      closeCheckoutModal();
      renderOwnerTables();
      alert(`🎉 SUCCESS! Order #${orderId} Confirmed!\n\nCustomer: ${name} (${authenticatedUser?.email})\nAmount: ₹${newOrderRecord.price}\nPayment Method:${paymentText}`);
    }

    function addToCart(productId) {
      const product = readyMadeProducts.find(p => p.id === productId);
      if (product) { cart.push(product); updateCartUI(); toggleCart(true); }
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      const badge = document.getElementById('cartBadge');
      if (badge) badge.innerText = cart.length;
      const list = document.getElementById('cartItemsList');
      if (!list) return;
      list.innerHTML = '';

      if (cart.length === 0) {
        list.innerHTML = `<div class="text-center py-10 text-stone-400"><i data-lucide="shopping-bag" class="w-10 h-10 mx-auto mb-2 opacity-40"></i><p class="text-sm font-medium">Your cart is empty.</p></div>`;
      } else {
        cart.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = "pt-3 flex gap-3 items-center justify-between";
          div.innerHTML = `
            <div class="flex items-center gap-3">
              <img src="${item.image}" class="w-12 h-12 object-cover rounded border border-stone-200">
              <div><h5 class="font-serif font-bold text-xs text-brand-dark">${item.title}</h5><p class="text-[10px] text-stone-500">${item.size} •${item.moulding}</p><p class="text-xs font-bold text-brand-dark mt-0.5">₹${item.price.toLocaleString('en-IN')}</p></div>
            </div>
            <button onclick="removeFromCart(${index})" class="text-stone-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          `;
          list.appendChild(div);
        });
      }

      const total = cart.reduce((acc, item) => acc + item.price, 0);
      const cartTotalEl = document.getElementById('cartTotalDisplay');
      if (cartTotalEl) cartTotalEl.innerText = `₹${total.toLocaleString('en-IN')}`;
      if (window.lucide) lucide.createIcons();
    }

    function toggleCart(forceOpen = false) {
      const drawer = document.getElementById('cartDrawer');
      if (!drawer) return;
      if (forceOpen) drawer.classList.remove('hidden');
      else drawer.classList.toggle('hidden');
    }

    function renderProducts(category = 'All') {
      const grid = document.getElementById('productsGrid');
      if (!grid) return;
      grid.innerHTML = '';
      const filtered = category === 'All' ? readyMadeProducts : readyMadeProducts.filter(p => p.category === category);

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl overflow-hidden border border-stone-200 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col group";
        card.innerHTML = `
          <div class="relative overflow-hidden bg-stone-100 aspect-[4/5] p-6 flex items-center justify-center">
            <div class="p-3 bg-white frame-shadow border-8 ${getMouldingClassByName(p.moulding)} transition-transform duration-500 group-hover:scale-105">
              <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover max-h-56">
            </div>
            <span class="absolute top-3 left-3 bg-brand-dark/80 backdrop-blur-xs text-white text-[10px] font-bold px-2.5 py-1 rounded">${p.category}</span>
          </div>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div><h4 class="font-serif text-lg font-bold text-brand-dark">${p.title}</h4><p class="text-xs text-stone-500 mt-1">${p.size} •${p.moulding}</p></div>
            <div class="mt-4 pt-4 border-t border-stone-100 flex items-center justify-between">
              <div><span class="text-[10px] text-stone-400 uppercase">Price</span><p class="font-serif text-xl font-bold text-brand-dark">₹${p.price.toLocaleString('en-IN')}</p></div>
              <button onclick="addToCart(${p.id})" class="px-3.5 py-2 bg-brand-dark hover:bg-brand-gold hover:text-brand-dark text-white rounded-lg text-xs font-semibold transition-colors flex items-center gap-1.5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add to Cart</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
      if (window.lucide) lucide.createIcons();
    }

    function getMouldingClassByName(name) {
      if (name.includes("Gold")) return "moulding-gold";
      if (name.includes("Teak")) return "moulding-teak";
      if (name.includes("Black")) return "moulding-black";
      return "moulding-silver";
    }

    function filterProducts(cat) {
      document.querySelectorAll('.category-btn').forEach(btn => {
        if (btn.innerText.includes(cat) || (cat === 'All' && btn.innerText === 'All')) {
          btn.className = "category-btn active px-3.5 py-1.5 rounded-full text-xs font-semibold bg-brand-dark text-white";
        } else {
          btn.className = "category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-stone-200 text-brand-dark hover:bg-stone-300";
        }
      });
      renderProducts(cat);
    }

          const tr = document.createElement('tr');

            <td class="py-3 px-4 font-semibold text-brand-dark">${idea.id}<br><span class="text-[10px] text-stone-400 font-normal">${idea.date}</span></td>

            <td class="py-3 px-4 max-w-xs"><p class="text-stone-800 text-[11px] leading-relaxed line-clamp-3">${idea.idea}</p></td>
            <td class="py-3 px-4"><img src="${idea.refImage}" class="w-12 h-12 object-cover rounded border border-stone-200"></td>
            <td class="py-3 px-4"><span class="text-stone-700 text-xs font-semibold">${idea.budget}</span></td>
            <td class="py-3 px-4"><span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${idea.status.includes('New') ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">${idea.status}</span></td>
            <td class="py-3 px-4 text-right"><button onclick="respondToPitch(${idx})" class="px-2.5 py-1 bg-brand-dark hover:bg-brand-gold text-white text-[11px] font-bold rounded">Set Custom Quote</button></td>
          `;
          ideasBody.appendChild(tr);

      const orderBody = document.getElementById('customOrdersTableBody');
      if (orderBody) {

          const tr = document.createElement('tr');
          tr.className = "hover:bg-stone-50";

            <td class="py-3 px-4 font-semibold text-brand-dark">${o.id}<br><span class="text-[10px] text-stone-400 font-normal">${o.date}</span></td>
            <td class="py-3 px-4"><span class="font-bold text-brand-dark">${o.customerName}</span><br><span class="text-stone-500 text-[10px]">${o.customerEmail}</span><br><span class="text-stone-400 text-[10px]">${o.customerPhone}</span></td>
            <td class="py-3 px-4"><img src="${o.photo}" class="w-10 h-10 object-cover rounded border border-stone-200"></td>

            <td class="py-3 px-4"><span class="text-[11px] font-semibold text-brand-dark block">${o.fulfillment}</span></td>
            <td class="py-3 px-4"><span class="font-bold text-brand-dark text-xs">₹${o.price.toLocaleString('en-IN')}</span></td>
            <td class="py-3 px-4"><span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${o.status.includes('Confirmed') \vert{}\vert{} o.status.includes('Payment') ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${o.status}</span></td>
            <td class="py-3 px-4 text-right"><button onclick="approveCustomOrder(${idx})" class="px-2.5 py-1 bg-brand-dark hover:bg-brand-gold text-white text-[11px] font-bold rounded">Update Status</button></td>
          `;
          orderBody.appendChild(tr);
        });
      }

      const invBody = document.getElementById('inventoryTableBody');
      if (invBody) {
        invBody.innerHTML = '';
        readyMadeProducts.forEach((p, idx) => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-stone-50";
          tr.innerHTML = `
            <td class="py-3 px-4 font-semibold text-brand-dark flex items-center gap-2"><img src="${p.image}" class="w-8 h-8 object-cover rounded"><span>${p.title}</span></td>
            <td class="py-3 px-4 text-stone-500">${p.category}</td>
            <td class="py-3 px-4 text-stone-500">${p.moulding}</td>
            <td class="py-3 px-4 text-stone-500">${p.size}</td>
            <td class="py-3 px-4 font-bold text-brand-dark">₹${p.price.toLocaleString('en-IN')}</td>
            <td class="py-3 px-4 text-right"><button onclick="deleteProduct(${idx})" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
          `;
          invBody.appendChild(tr);
        });
      }

      const uniqueIdeasCountEl = document.getElementById('ownerUniqueIdeasCount');
      if (uniqueIdeasCountEl) uniqueIdeasCountEl.innerText = uniqueFramePitches.length;
      const pendingOrdersCountEl = document.getElementById('ownerPendingOrdersCount');
      if (pendingOrdersCountEl) pendingOrdersCountEl.innerText = customOrders.length;
      const stockCountEl = document.getElementById('ownerStockCount');
      if (stockCountEl) stockCountEl.innerText = readyMadeProducts.length;
      const totalOrdersCountEl = document.getElementById('ownerTotalOrdersCount');
      if (totalOrdersCountEl) totalOrdersCountEl.innerText = customOrders.length;
      if (window.lucide) lucide.createIcons();

    function respondToPitch(index) {
      const quote = prompt(`Enter custom quotation price for ${uniqueFramePitches[index].clientName}'s idea:`, "₹4,200");
      if (quote) {
        uniqueFramePitches[index].status = `Quote Sent: ${quote}`;
        renderOwnerTables();
        alert(`Status updated! Quote ${quote} recorded.`);
      }
    }

    function approveCustomOrder(index) {
      const newStatus = prompt("Enter new status:", "Ready for Pickup at Chola Naka");
      if (newStatus) { customOrders[index].status = newStatus; renderOwnerTables(); }
    }

    function deleteProduct(index) {
      if (confirm("Are you sure you want to remove this frame from the store?")) {
        readyMadeProducts.splice(index, 1);
        renderProducts();
        renderOwnerTables();
      }
    }

    function openNewFrameModal() { document.getElementById('newFrameModal').classList.remove('hidden'); }
    function closeNewFrameModal() { document.getElementById('newFrameModal').classList.add('hidden'); }

    function handleAddNewFrame(e) {
      e.preventDefault();
      const newP = {
        id: Date.now(),
        title: document.getElementById('newTitle')?.value || "Untitled Frame",
        category: document.getElementById('newCategory')?.value || "Modern",
        moulding: document.getElementById('newMoulding')?.value || "Standard Wood",
        size: document.getElementById('newDimensions')?.value || "12x16",
        price: parseInt(document.getElementById('newPrice')?.value || "999"),
        image: document.getElementById('newImageUrl')?.value || "https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=800&q=80"
      };
      readyMadeProducts.unshift(newP);
      closeNewFrameModal();
      renderProducts();
      renderOwnerTables();
      alert("New frame added successfully to Chetan modern photoframe store!");
    }

    function init3DHero() {
      const container = document.getElementById('threeHeroCanvas');
      if (!container) return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 10);

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xfff8ee, 1.2);
      scene.add(ambientLight);

      const goldDirectional = new THREE.DirectionalLight(0xE2B873, 2.0);
      goldDirectional.position.set(5, 5, 5);
      scene.add(goldDirectional);

      const softBackLight = new THREE.PointLight(0xffffff, 0.8);
      softBackLight.position.set(-5, -3, 2);
      scene.add(softBackLight);

      const framesGroup = new THREE.Group();
      scene.add(framesGroup);

      function createFrameMesh(w, h, depth, border, gold = true) {
        const frameG = new THREE.Group();
        const frameMat = new THREE.MeshStandardMaterial({
          color: gold ? 0xC59A53 : 0x533318,
          metalness: gold ? 0.75 : 0.15,
          roughness: gold ? 0.3 : 0.6
        });

        const topGeo = new THREE.BoxGeometry(w, border, depth);
        const top = new THREE.Mesh(topGeo, frameMat);
        top.position.y = (h / 2) - (border / 2);
        frameG.add(top);

        const btm = new THREE.Mesh(topGeo, frameMat);
        btm.position.y = - (h / 2) + (border / 2);
        frameG.add(btm);

        const sideGeo = new THREE.BoxGeometry(border, h - 2 * border, depth);
        const left = new THREE.Mesh(sideGeo, frameMat);
        left.position.x = - (w / 2) + (border / 2);
        frameG.add(left);

        const right = new THREE.Mesh(sideGeo, frameMat);
        right.position.x = (w / 2) - (border / 2);
        frameG.add(right);

        const artGeo = new THREE.PlaneGeometry(w - border * 2, h - border * 2);
        const artMat = new THREE.MeshStandardMaterial({
          color: gold ? 0xfffcf7 : 0xe8e4de,
          roughness: 0.8
        });
        const art = new THREE.Mesh(artGeo, artMat);
        art.position.z = -depth / 4;
        frameG.add(art);

        return frameG;
      }

      const centerFrame = createFrameMesh(3.4, 4.4, 0.25, 0.25, true);
      centerFrame.position.set(0, 0.3, 0);
      framesGroup.add(centerFrame);

      const leftFrame = createFrameMesh(2.2, 3.0, 0.2, 0.18, false);
      leftFrame.position.set(-3.6, -0.6, -1.5);
      leftFrame.rotation.y = 0.35;
      leftFrame.rotation.z = -0.05;
      framesGroup.add(leftFrame);

      const rightFrame = createFrameMesh(2.4, 3.2, 0.2, 0.18, true);
      rightFrame.position.set(3.6, 0.6, -1.2);
      rightFrame.rotation.y = -0.35;
      rightFrame.rotation.z = 0.05;
      framesGroup.add(rightFrame);

      const creatures = [];
      const numCreatures = 4;

      function createButterfly() {
        const bGroup = new THREE.Group();
        const wingMat = new THREE.MeshStandardMaterial({
          color: 0xE2B873,
          metalness: 0.8,
          roughness: 0.2,
          side: THREE.DoubleSide
        });

        const leftWingGeo = new THREE.BufferGeometry();
        const verticesLeft = new Float32Array([0, 0, 0, -0.5, 0.5, 0, -0.4, -0.4, 0]);
        leftWingGeo.setAttribute('position', new THREE.BufferAttribute(verticesLeft, 3));
        const leftWing = new THREE.Mesh(leftWingGeo, wingMat);

        const rightWingGeo = new THREE.BufferGeometry();
        const verticesRight = new Float32Array([0, 0, 0, 0.5, 0.5, 0, 0.4, -0.4, 0]);
        rightWingGeo.setAttribute('position', new THREE.BufferAttribute(verticesRight, 3));
        const rightWing = new THREE.Mesh(rightWingGeo, wingMat);

        bGroup.add(leftWing);
        bGroup.add(rightWing);
        bGroup.scale.set(0.7, 0.7, 0.7);

        return {
          mesh: bGroup,
          leftWing: leftWing,
          rightWing: rightWing,
          phase: Math.random() * Math.PI * 2,
          speed: 0.015 + Math.random() * 0.015,
          radiusX: 2.5 + Math.random() * 2.0,
          radiusY: 1.2 + Math.random() * 1.5,
          offsetY: (Math.random() - 0.5) * 2
        };
      }

      for (let i = 0; i < numCreatures; i++) {
        const c = createButterfly();
        scene.add(c.mesh);
        creatures.push(c);
      }

      let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
      });

      window.addEventListener('resize', () => {
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        targetX += (mouseX - targetX) * 0.05;
        targetY += (mouseY - targetY) * 0.05;

        framesGroup.rotation.y = targetX * 0.25;
        framesGroup.rotation.x = -targetY * 0.15;
        centerFrame.position.y = 0.3 + Math.sin(elapsedTime * 1.5) * 0.1;
        leftFrame.position.y = -0.6 + Math.cos(elapsedTime * 1.2) * 0.08;
        rightFrame.position.y = 0.6 + Math.sin(elapsedTime * 1.4 + 1) * 0.08;

        creatures.forEach((c, index) => {
          const t = elapsedTime * 1.5 + c.phase;
          c.mesh.position.x = Math.sin(t) * c.radiusX + (targetX * 1.5);
          c.mesh.position.y = Math.cos(t * 0.8) * c.radiusY + c.offsetY;
          c.mesh.position.z = Math.cos(t) * 1.5 + 1.2;
          c.mesh.rotation.y = Math.atan2(Math.cos(t), -Math.sin(t));
          c.mesh.rotation.z = Math.sin(t * 2) * 0.2;
          const flap = Math.sin(elapsedTime * 18 + index) * 0.75;
          c.leftWing.rotation.y = flap;
          c.rightWing.rotation.y = -flap;
        });

        renderer.render(scene, camera);
      }
      animate();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderProducts();
      init3DHero();
      updateCalculation();
      updateAuthHeaderUI();
      renderOwnerTables();
      syncOwnerPaymentUI();
      checkIncomingEmailConfirmation();
      if (window.lucide) lucide.createIcons();
    });
  <\/script>
</body>
</html>`;

      link.href = URL.createObjectURL(blob);
      link.download = 'index.html';
      document.body.appendChild(link);

      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
